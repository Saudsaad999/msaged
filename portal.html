function rasterize(src){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width||640;c.height=im.height||480;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>res(b),'image/jpeg',.9)};im.src=src})}

const ASCII_NAMES=[['كراسة-التنفيذ','Execution-Booklet'],['تقرير-التنفيذ','Execution-Report'],['تقرير-البلاغ','Field-Report'],['تقرير-انجاز','Progress-Report'],['التقرير-الاحصائي','Statistics-Report'],['الطلبات-المنفذة','Completed-Requests'],['مستخدمو-التطبيق','App-Users'],['الإحصائيات','Statistics'],['متسابقو','Contestants'],['كراسة','Booklet'],['طلب','Request']];
const asciiName=n=>{let s=n;ASCII_NAMES.forEach(([a,b])=>s=s.split(a).join(b));s=s.replace(/[^\x20-\x7E]/g,'').replace(/\s+/g,'-').replace(/-{2,}/g,'-').replace(/^-+/,'');return /^[\w-]*\.\w+$/.test(s)&&!s.startsWith('.')?'Zulfi-'+s:'Zulfi-file'+(n.match(/\.\w+$/)||[''])[0]};
function directDownload(filename,data){filename=asciiName(filename);try{const ext=(filename.split('.').pop()||'').toLowerCase();const blob=data instanceof Blob?new Blob([data],{type:MIME[ext]||data.type||'application/octet-stream'}):new Blob([data],{type:MIME[ext]||'application/octet-stream'});
  const file=new File([blob],filename,{type:blob.type});const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.setAttribute('download',filename);a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000);toast('بدأ تحميل الملف: '+filename,'download');return true}

async function saveFile(filename,data){
  if(DL===null){try{DL=window.claude?.use?await window.claude.use('downloads'):null}catch(e){DL=null}}
  if(!DL)return directDownload(filename,data);
  try{await DL.save({filename,data});toast('تم حفظ الملف: '+filename,'download');return true}
  catch(e){const c=e&&e.code;
    if(c==='declined')toast('أُلغي التحميل','info');
    else if(c==='rate_limited')toast('هناك نافذة تحميل مفتوحة، أكملها أولاً','info');

/* opts: {title, meta:[[k,v],...], head:[...], rows:[[...]], totals:[[...]], widths:[...], sections:[{title,head,rows}]} */
function exportXlsx(filename,sheetName,opt){
  if(!window.XLSX){toast('مكتبة Excel لم تُحمّل بعد','info');return}
  const blocks=opt.sections||[{head:opt.head,rows:opt.rows,totals:opt.totals}];const n=Math.max(...blocks.map(b=>b.head.length),4);
  const aoa=[],st=[],merges=[],hts=[];const push=(row,style,merge,ht)=>{const r=aoa.length;const full=[...row];while(full.length<n)full.push('');aoa.push(full);st.push(Array.isArray(style)?style:full.map(()=>style));if(merge)merges.push({s:{r,c:0},e:{r,c:n-1}});hts[r]=ht?{hpt:ht}:undefined};
  push([ORG.full],xs({b:1,sz:15,c:XC.w,f:XC.navy,h:'center',bc:XC.navy}),1,30);
  push(['المملكة العربية السعودية · مسجلة لدى المركز الوطني لتنمية القطاع غير الربحي · '+ORG.lic],xs({sz:10,c:XC.w,f:XC.navy2,h:'center',bc:XC.navy2}),1,20);
  push([`هاتف: ${ORG.phone}   ·   ${ORG.email}   ·   ${ORG.web}`],xs({sz:10,c:XC.goldT,f:XC.goldS,h:'center',bc:XC.goldL}),1,20);
  push([''],xs({nb:1}),1,8);
  push([opt.title],xs({b:1,sz:14,c:XC.navy2,h:'center',nb:1}),1,26);
  (opt.meta||[]).forEach(([k,v])=>{const row=[k,v];push(row,row.map((_,c)=>c===0?xs({b:1,c:XC.navy,f:XC.goldS,bc:XC.goldL}):xs({bc:XC.goldL})).concat(Array(n).fill(xs({nb:1}))));});
  blocks.forEach(bk=>{push([''],xs({nb:1}),0,10);if(bk.title)push([bk.title],xs({b:1,sz:12,c:XC.navy2,f:XC.gold,bc:XC.gold}),1,22);
    push(bk.head,xs({b:1,c:XC.w,f:XC.navy,h:'center',bc:XC.navy}),0,24);
    bk.rows.forEach((r,i)=>push(r,r.map((v,c)=>xs({f:i%2?XC.alt:XC.w,h:typeof v==='number'?'center':'right'})).concat(Array(n).fill(xs({f:i%2?XC.alt:XC.w})))));
    (bk.totals||[]).forEach(r=>push(r,xs({b:1,c:XC.navy2,f:XC.goldS,h:'center',bc:XC.gold})));});
  push([''],xs({nb:1}),1,8);push([`صدر من لوحة تحكم ${ORG.name} بتاريخ ${today()}`],xs({sz:9,c:XC.muted,h:'center',nb:1}),1);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  aoa.forEach((row,r)=>row.forEach((v,c)=>{const a=XLSX.utils.encode_cell({r,c});if(!ws[a])ws[a]={t:'s',v:''};const s=st[r][c];if(s)ws[a].s=s;if(typeof v==='number'&&!Number.isInteger(v))ws[a].z='#,##0.00';else if(typeof v==='number')ws[a].z='#,##0'}));
  ws['!cols']=(opt.widths||[]).map(w=>({wch:w}));ws['!merges']=merges;ws['!rows']=hts;ws['!views']=[{RTL:true}];
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,sheetName.slice(0,30));
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveFile(filename,new Blob([out]));
}

const STEPS=['جديدة','مقبول','جاري العمل','منتهي'];
function reqTimeline(r){const si=r.status==='مرفوض'?-1:STEPS.indexOf(r.status);const d=[r.date,r.assignedAt,r.assignedAt&&r.status!=='مقبول'?r.assignedAt:'',r.doneAt];

    ${r.pieces&&Object.keys(r.pieces).length?`<div class="field"><label>القطع والمواد المنفذة</label><div class="chips">${Object.entries(r.pieces).map(([k,v])=>`<span class="pill ok">${esc(k)}: <b class="num">${v}</b></span>`).join('')}</div></div>`:''}
    ${r.rating?`<div class="field"><label>تقييم مقدم الطلب</label><div class="card card-b small"><span class="stars">${stars(r.rating)}</span> ${esc(r.ratingComment||'')}</div></div>`:''}

      ${r.status==='منتهي'&&!r.rating?`<button class="btn gold" data-d="askRate">${ic('reviews')}${r.ratingRequested?'إعادة إرسال طلب التقييم':'إرسال طلب تقييم لمقدم الطلب'}</button>`:''}

  const w=drawer(`<div class="drawer-h"><span class="svc-ic">${ic(s.icon)}</span><div style="min-width:0"><h2>طلب #${r.id}</h2><div class="small muted">${esc(r.title)} · ${esc(s.name)}</div></div><button class="icon-btn" style="margin-right:auto" data-x aria-label="إغلاق">${ic('close')}</button></div>
  <div class="drawer-b">${reqDetailsHTML(r)}${actions}
    <div class="row"><button class="btn" data-d="pdf">${ic('picture_as_pdf')}تصدير PDF بالكليشة</button>${role==='admin'?`<button class="btn" data-d="chat">${ic('forum')}المحادثة</button>`:''}<button class="btn" data-d="note">${ic('sticky_note_2')}ملاحظة متابعة</button></div>
    <div id="dExtra"></div></div>`);
  w.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;const a=b.dataset.d;const ex=$('#dExtra',w);

    else if(a==='reject'){ex.innerHTML=`<div class="field"><label for="rjR">سبب الرفض (يظهر لمقدم الطلب)</label><textarea class="inp" id="rjR">الجامع مشمول بعقد صيانة مستقل.</textarea></div><button class="btn danger" data-d="rejectOk" style="margin-top:8px">${ic('block')}تأكيد الرفض</button>`;return}

const PIECE_CATS=['سباكة','كهرباء','تكييف','مواد عناية'];

  let t=S.chats.find(c=>c.req===r.id&&c.with===r.by);if(!t){t={id:uid('T'),req:r.id,with:r.by,kind:r.byRole||'مقدم الطلب',unread:0,msgs:[]};S.chats.unshift(t)}return t}

function execTable(b,editable){
  return b.chapters.map((c,ci)=>{const done=c.items.filter((_,ii)=>(b.exec[ci+'-'+ii]?.pct||0)>=100).length;return `<div class="card"><div class="card-h"><div><b>الباب ${ci+1}: ${esc(c.title)}</b><p class="num">${done} من ${c.items.length} بنود منجزة</p></div><div class="prog" style="max-width:220px"><div class="bar"><i style="width:${c.items.length?done/c.items.length*100:0}%;background:var(--ok)"></i></div></div></div><div>
  ${c.items.map((it,ii)=>{const k=ci+'-'+ii,e=b.exec[k]||{pct:0,note:'',files:[]},ok=e.pct>=100;return `<div class="exec-item ${ok?'done':''}">
    <div class="head"><${editable?`button type="button" data-act="execDone" data-id="${b.id}" data-k="${k}" aria-label="${ok?'إلغاء الإنجاز':'تعليم كمنجز'}"`:'span'} class="chk">${ic(ok?'check':'radio_button_unchecked',ok)}</${editable?'button':'span'}>
      <div style="flex:1;min-width:0"><div class="row" style="gap:6px"><span class="pill gold num">${ci+1}.${ii+1}</span><b class="small" style="${ok?'':''}">${esc(it.d||'—')}</b></div>
        <div class="tiny muted num" style="margin-top:3px">${fmt(it.q)} ${esc(it.u)}${it.n?' · '+esc(it.n):''}</div></div>
      <div class="prog" style="width:170px;flex:0 0 auto">${editable?`<input type="range" min="0" max="100" step="5" value="${e.pct}" data-exec="${b.id}" data-k="${k}" data-ef="pct" aria-label="نسبة الإنجاز" style="flex:1">`:`<div class="bar"><i style="width:${e.pct}%;${ok?'background:var(--ok)':''}"></i></div>`}<b class="num small" id="ep-${b.id}-${k}">${e.pct}%</b></div></div>
    <div class="exec-doc"><span class="lbl">${ic('verified')}توثيق البند ${ok&&e.doneAt?`<span class="muted num" style="font-weight:400">· أُنجز ${e.doneAt}</span>`:''}</span>
      ${editable?`<input class="inp" value="${esc(e.note)}" data-exec="${b.id}" data-k="${k}" data-ef="note" placeholder="ملاحظة التنفيذ والتوثيق" aria-label="ملاحظة">`:`<span class="small">${esc(e.note||'لا توجد ملاحظات')}</span>`}
      <div class="row" style="justify-content:space-between">${thumbsHTML(e.files,editable?`exec:${b.id}:${k}`:'')||'<span class="tiny muted">لا توجد صور توثيق</span>'}${editable?attachPicker(`exec:${b.id}:${k}`):''}</div></div>
  </div>`}).join('')}</div></div>`}).join('');
}

function qForm(cid,qi){const c=S.contests.find(x=>x.id===cid),q=qi!=null?c.qs[qi]:null;

function playC(cid){const c=S.contests.find(x=>x.id===cid);if(!c||!c.qs.length){toast('أضف أسئلة للمسابقة أولاً','info');return}

    const q=c.qs[i];box.innerHTML=`<div class="row" style="justify-content:space-between"><span class="pill gold">السؤال ${i+1} من ${c.qs.length}</span><span class="small muted num">${q.pts} درجات</span></div><div class="bar" style="margin:10px 0"><i style="width:${i/c.qs.length*100}%"></i></div><h2 style="margin-bottom:12px">${esc(q.t)}</h2>
    ${q.type==='إجابة نصية'?`<input class="inp" id="qzA" placeholder="اكتب إجابتك"><button class="btn pri" style="margin-top:10px" data-ans="text">تأكيد</button>`:`<div style="display:flex;flex-direction:column;gap:8px">${q.opts.map((o,oi)=>`<button class="opt" data-ans="${oi}">${esc(o)}</button>`).join('')}</div>`}<div id="qzFb" class="small" style="margin-top:10px"></div>`};

const planLive=p=>S.requests.filter(r=>r.status==='منتهي'&&r.svc===p.svc&&(!p.from||(r.doneAt||'')>=p.from)).length;
const planDone=p=>Math.min(p.target,(+p.base||0)+planLive(p));
const planPct=p=>p.target?Math.round(planDone(p)/p.target*100):0;
function mosquesAgg(){const m={};const get=(n,d)=>m[n]=m[n]||{mosque:n,district:d,visits:0,last:'',p:{},reqs:[]};
  S.mosqueHist.forEach(h=>{const o=get(h.mosque,h.district);o.visits+=h.visits;o.last=h.last>o.last?h.last:o.last;Object.entries(h.p).forEach(([k,v])=>o.p[k]=(o.p[k]||0)+v)});
  S.requests.filter(r=>r.status==='منتهي').forEach(r=>{const o=get(r.mosque,r.district);o.visits++;o.reqs.push(r);if((r.doneAt||'')>o.last)o.last=r.doneAt;Object.entries(r.pieces||{}).forEach(([k,v])=>o.p[k]=(o.p[k]||0)+v)});
  return Object.values(m).sort((a,b)=>b.visits-a.visits)}
function planHTML(edit){return `<div class="card"><div class="card-h"><div><h2>${ic('flag')} الخطة التشغيلية للمساجد</h2><p>كل طلب يُنفَّذ في خدمة المشروع يُخصم تلقائياً من المساجد المتبقية</p></div>${edit?`<button class="btn sm pri" data-act="planForm">${ic('add')}إضافة مشروع</button>`:''}</div>

  ${S.plan.map(p=>{const d=planDone(p),pc=planPct(p);return `<tr><td><b class="small">${esc(p.name)}</b>${planLive(p)?`<div class="tiny" style="color:var(--ok)">+${planLive(p)} من الطلبات المنفذة</div>`:''}</td><td class="small">${ic(svcById(p.svc).icon)} ${esc(svcById(p.svc).name)}</td><td class="num">${fmt(p.target)} مسجد</td><td class="num">${fmt(d)}</td><td class="num"><b>${fmt(Math.max(0,p.target-d))}</b></td><td><div class="prog"><div class="bar"><i style="width:${pc}%;${pc>=100?'background:var(--ok)':''}"></i></div><b class="num small">${pc}%</b></div></td><td class="num tiny">${p.from} ← ${p.to}</td>${edit?`<td class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="planForm" data-id="${p.id}" aria-label="تعديل">${ic('edit')}</button><button class="btn sm ghost danger" data-act="planDel" data-id="${p.id}" aria-label="حذف">${ic('delete')}</button></td>`:''}</tr>`}).join('')||`<tr><td colspan="8"><div class="empty">لا توجد مشاريع في الخطة. أضف مشروعاً بعدد المساجد المستهدفة.</div></td></tr>`}

function openTask(id){const r=S.requests.find(x=>x.id===id);const s=svcById(r.svc);
  const w=drawer(`<div class="drawer-h"><span class="svc-ic">${ic(s.icon)}</span><div style="min-width:0"><h2>مهمة #${r.id}</h2><div class="small muted">${esc(r.title)}</div></div><button class="icon-btn" style="margin-right:auto" data-x aria-label="إغلاق">${ic('close')}</button></div>
  <div class="drawer-b">${reqDetailsHTML(r)}
    <div class="row">${r.status==='مقبول'?`<button class="btn pri" data-d="start">${ic('play_arrow')}بدء التنفيذ</button>`:''}${r.status==='جاري العمل'?`<button class="btn pri" data-d="done">${ic('task_alt')}رفع تقرير الإنجاز وإغلاق</button>`:''}<button class="btn" data-d="chat">${ic('forum')}مراسلة الإدارة</button><button class="btn" data-d="pdf">${ic('picture_as_pdf')}PDF</button></div><div id="dExtra"></div></div>`);
  w.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;const a=b.dataset.d,ex=$('#dExtra',w);
    if(a==='start'){r.status='جاري العمل';const me=repById(SESSION.id);me.status='في مهمة';logIt('بدء تنفيذ '+r.id);toast('بدأت المهمة')}
    else if(a==='done'){ex.innerHTML=`<div class="field"><label for="rpT">تقرير الإنجاز *</label><textarea class="inp" id="rpT"></textarea></div>${piecesInputs()}<p class="tiny muted">أرفق صور ما بعد التنفيذ من قسم المرفقات أعلاه قبل الإغلاق.</p><button class="btn pri" data-d="doneOk">${ic('task_alt')}تأكيد الإنجاز</button>`;$('#rpT',w).focus();return}
    else if(a==='doneOk'){const t=$('#rpT',w).value.trim();if(!t){toast('اكتب تقرير الإنجاز','error');return}r.status='منتهي';r.report=t;r.doneAt=today();r.pieces=readPieces(w);planHit(r);const me=repById(SESSION.id);me.done++;me.status='متاح';S.notifs.unshift({t:`${me.name} أنجز الطلب #${r.id}`,at:'الآن',go:'requests'});logIt('إنجاز '+r.id);toast('أُغلقت المهمة وأُشعرت الإدارة')}
    else if(a==='chat'){w.remove();UI.chat=threadFor(r,'rep').id;go('chats');return}
    else if(a==='pdf'){reqPdf(r);return}
    else if(a==='dlAll'){(async()=>{for(const at of r.atts){if(await downloadAtt(at)===false)break}})();return}
    render();openTask(r.id)})}

function offerForm(oid){const o=S.opps.find(x=>x.id===oid);const me=SESSION.id;const my=o.offers.find(f=>f.rep===me);TMP.offer={atts:[...(my?.atts||[])]};const b=S.booklets.find(x=>x.id===o.booklet);
  const w=modal({title:'عرض سعر: '+o.title,icon:'request_quote',ok:my?'تحديث العرض':'إرسال العرض',body:`${b?`<p class="small muted">تقدير الكراسة غير معلن. عدد البنود ${bookTotals(b).cnt} · مدة التنفيذ المطلوبة ${esc(b.duration||'—')}</p>`:''}<div class="grid g2"><div class="field"><label for="ofV">قيمة العرض شامل الضريبة (ر.س) *</label><input class="inp num" type="number" id="ofV" value="${my?.value||''}"></div><div class="field"><label for="ofD">مدة التنفيذ (يوم) *</label><input class="inp num" type="number" id="ofD" value="${my?.days||''}"></div></div>

    ${reqDetailsHTML(r)}
    <div class="row">${r.status==='مقبول'&&r.ack?`<button class="btn pri" data-d="start">${ic('play_arrow')}بدء التنفيذ</button>`:''}${r.status==='جاري العمل'?`<button class="btn pri" data-d="done">${ic('task_alt')}رفع تقرير الإنجاز وإغلاق</button>`:''}
      ${r.phone?`<button class="btn" data-copy="${esc(r.phone)}" data-cl="نُسخ جوال مقدم الطلب">${ic('call')}جوال مقدم الطلب</button>`:''}${r.map?`<a class="btn" href="${esc(r.map)}" target="_blank" rel="noopener">${ic('directions')}الاتجاهات</a>`:''}

    <div id="dExtra"></div></div>`);
  w.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;const a=b.dataset.d,ex=$('#dExtra',w);
    if(a==='ack'){r.ack=true;threadFor(r,'rep').msgs.push({me:0,t:`تم قبول المهمة #${r.id} وسأباشرها بإذن الله قبل ${fmtDate(r.dueAt)}.`,at:nowT()});toast('قُبلت المهمة')}

    else if(a==='done'){ex.innerHTML=`<div class="field"><label for="rpT">تقرير الإنجاز *</label><textarea class="inp" id="rpT" placeholder="ما الذي تم تنفيذه؟"></textarea></div>${piecesInputs()}<p class="tiny muted">أرفق صور ما بعد التنفيذ من قسم المرفقات أعلاه قبل الإغلاق.</p><button class="btn pri" data-d="doneOk">${ic('task_alt')}تأكيد الإنجاز</button>`;$('#rpT',w).focus();return}
    else if(a==='doneOk'){const t=$('#rpT',w).value.trim();if(!t){toast('اكتب تقرير الإنجاز','error');return}r.status='منتهي';r.report=t;r.doneAt=today();r.pieces=readPieces(w);me.done++;me.status='متاح';threadFor(r,'rep').msgs.push({me:0,t:`أُنجزت المهمة #${r.id}: ${t}`,at:nowT()});toast('أُغلقت المهمة وأُرسل التقرير للإدارة')}
    else if(a==='chat'){w.remove();UI.chat=threadFor(r,'rep').id;go('chats');return}
    else if(a==='pdf'){reqPdf(r);return}
    else if(a==='dlAll'){(async()=>{for(const at of r.atts){if(await downloadAtt(at)===false)break}})();return}
    render();openTask(r.id)})};

const curStage=r=>r.closed?6:(r.stage||(r.status==='منتهي'?5:r.status==='جاري العمل'?3:1));

/* print: booklet + execution-stage attachments only */
function execPrint(r){const b=isContractor()?bookOf(r):null;const me=repById(SESSION.id);const st3=stAtts(r,3);
  const head=[{title:b?'كراسة التنفيذ ومرفقاتها':'تقرير مرحلة التنفيذ ومرفقاتها',sub:`${b?b.title:r.title} · طلب #${r.id}`},
    {kv:[['المسجد',`${r.mosque} - ${r.district}`],['المنفذ',`${me.name} (${me.kind})`],['رقم الكراسة',b?b.id:'—'],['اعتماد الكراسة',b?.sign?.board?`${b.sign.board} (${b.sign.boardDate})`:'—'],['تاريخ الإسناد',fmtDate(r.assignedAt)],['موعد التسليم',fmtDate(r.dueAt)],['نسبة الإنجاز',(b?bookProgress(b):(r.exe?.pct||0))+'%'],['تاريخ الطباعة',fmtDate(today())]]}];
  const blocks=[...head];
  if(b){const rows=[];const docs=[];
    b.chapters.forEach((c,ci)=>{rows.push({cells:[`الباب ${ci+1}: ${c.title}`,'','','',''],bold:true,fill:'#F3ECDD'});
      c.items.forEach((it,ii)=>{const e=b.exec[ci+'-'+ii]||{pct:0,note:'',files:[]};const ok=e.pct>=100;
        rows.push({cells:[`${ci+1}.${ii+1}  ${it.d}`,`${fmt(it.q)} ${it.u}`,e.pct+'%',ok?'✓ منجز'+(e.doneAt?' '+fmtDate(e.doneAt):''):e.pct?'قيد التنفيذ':'لم يبدأ',e.note||'—'],fill:ok?'#E3F3EA':undefined});
        if((e.files||[]).length||e.note)docs.push({ci,ii,it,e})})});
    blocks.push({h:'بنود الكراسة وحالة التنفيذ'},{table:{cols:[{t:'البند',w:5},{t:'الكمية',w:1.4,a:'center'},{t:'الإنجاز',w:1,a:'center'},{t:'الحالة',w:1.8,a:'center'},{t:'ملاحظة التوثيق',w:3}],rows}});
    if(docs.length){blocks.push({h:'توثيق البنود المنفذة'});docs.forEach(({ci,ii,it,e})=>{blocks.push({text:`البند ${ci+1}.${ii+1}: ${it.d} — ${e.pct}%${e.note?' · '+e.note:''}`,bold:true,size:16,color:'#1D5271'});const im=(e.files||[]).filter(a=>a.type==='image').map(a=>({...a,name:`${ci+1}.${ii+1} · ${a.name}`}));if(im.length)blocks.push({imgs:im})})}}
  else{const L=r.exe?.log||[];blocks.push({h:'سجل التحديثات الميدانية'},L.length?{table:{cols:[{t:'التحديث',w:6},{t:'الإنجاز',w:1,a:'center'},{t:'الوقت',w:2,a:'center'}],rows:L.map(l=>({cells:[l.t,(l.pct??'')+'%',l.at]}))}}:{text:'لا توجد تحديثات مسجلة.'});
    if(r.exe?.state)blocks.push({text:'الحالة التشغيلية: '+r.exe.state,bold:true})}
  if(st3.length){blocks.push({h:`مرفقات مرحلة التنفيذ (${st3.length})`});
    const kinds=[...new Set(st3.map(a=>a.kind||'أخرى'))];kinds.forEach(k=>{const L=st3.filter(a=>(a.kind||'أخرى')===k);blocks.push({text:k+` (${L.length})`,bold:true,size:16,color:'#8A6F3D'});const im=L.filter(a=>a.type==='image');if(im.length)blocks.push({imgs:im});const fl=L.filter(a=>a.type!=='image');if(fl.length)blocks.push({text:'ملفات مرفقة: '+fl.map(a=>a.name).join('، '),size:15})})}
  else if(!b)blocks.push({h:'مرفقات مرحلة التنفيذ'},{text:'لا توجد مرفقات لمرحلة التنفيذ.'});
  blocks.push({gap:14},{sigs:[['المنفذ',me.name,''],['المشرف الميداني','',''],['مدير المشروع',b?.manager||'','']],stamp:!!b?.sign?.stamp});
  pdfPreview((b?'كراسة التنفيذ ':'تقرير التنفيذ ')+'#'+r.id,blocks,{ref:b?b.id:'#'+r.id},`${b?'كراسة-التنفيذ-'+b.id:'تقرير-التنفيذ-'+r.id}.pdf`)}

function taskPdf(r){const s=svcById(r.svc),p=repById(r.rep);const imgs=r.atts.filter(a=>a.type==='image');
  pdfPreview('تقرير البلاغ #'+r.id,[{title:'تقرير البلاغ الميداني',sub:`#${r.id} · ${s.name} · ${STATE_TXT(r)}`},
    {kv:[['المسجد',`${r.mosque} - ${r.district}`],['مقدم الطلب',`${r.by} (${r.byRole||''})`],['الجوال',r.phone||'—'],['المنفذ',p?.name||'—'],['تاريخ الإسناد',fmtDate(r.assignedAt)],['موعد التسليم / الإنجاز',fmtDate(r.doneAt||r.dueAt)],['الأولوية',r.priority],['نسبة الإنجاز',overallPct(r)+'%']]},
    {h:'مراحل الطلب'},{table:{cols:[{t:'المرحلة',w:3},{t:'الحالة',w:2,a:'center'}],rows:STAGES().map(x=>({cells:[`${x.n}. ${x.t}`,curStage(r)>x.n?'منجزة':curStage(r)===x.n?'نشطة':'مجدولة']}))}},
    {h:'وصف الطلب'},{text:r.note},
    ...(r.insp?.diag?[{h:'المعاينة الميدانية'},{kv:[['التشخيص',r.insp.diag],['نتائج الفحص',r.insp.find||'—'],['التوصية',r.insp.rec||'—'],['وقت المعاينة',dtFmt(r.insp.at)]],cols:1}]:[]),
    ...(r.exe?.log?.length?[{h:'سجل التنفيذ'},{table:{cols:[{t:'التحديث',w:6},{t:'الإنجاز',w:1,a:'center'},{t:'الوقت',w:2,a:'center'}],rows:r.exe.log.map(l=>({cells:[l.t,(l.pct??'')+'%',l.at]}))}}]:[]),
    ...(r.report?[{h:'تقرير الإنجاز'},{text:r.report}]:[]),
    ...(r.rating?[{h:'تقييم الإمام'},{text:`${r.rating} من 5 · ${r.ratingComment||''}`}]:[]),
    ...(imgs.length?[{h:'الصور والتوثيق'},{imgs}]:[]),{gap:10},{sigs:[['المنفذ',p?.name||'',''],['المشرف الميداني','',''],['جمعية المساجد بالزلفي','','']]}],{ref:'#'+r.id},`تقرير-البلاغ-${r.id}.pdf`)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-ps]');if(!t||UI.view!=='p_task')return;const r=S.requests.find(x=>x.id===UI.task);const me=repById(SESSION.id);const a=t.dataset.ps;const v=id=>($('#'+id)?.value||'').trim();
  const msg=(txt)=>threadFor(r,'rep').msgs.push({me:0,t:txt,at:nowT()});const set=n=>{r.stage=n;UI.stg=null};
  if(a==='ack'){r.ack=true;r.stage=1;msg(`تم قبول المهمة #${r.id} وسأباشرها بإذن الله قبل ${fmtDate(r.dueAt)}.`);toast('قُبلت المهمة')}
  else if(a==='decline'){const why=v('dcR');r.notes=r.notes||[];r.notes.push({t:'اعتذر المسند إليه: '+why,by:me.name,at:today()});msg(`أعتذر عن المهمة #${r.id}: ${why}`);r.rep='';r.status='جديدة';r.assignedAt='';toast('أُرسل الاعتذار وأُعيدت المهمة للإدارة','do_not_disturb_on');go('p_tasks');return}
  else if(a==='toInsp'){set(2);r.status='جاري العمل';me.status='في مهمة';r.insp=r.insp||{at:new Date().toISOString().slice(0,16),parts:'لا'};toast('بدأت مرحلة المعاينة الميدانية')}
  else if(a==='saveInsp'||a==='toExec'){r.insp={by:me.name,at:v('inAt'),parts:v('inP'),diag:v('inD'),find:v('inF'),rec:v('inR')};if(a==='toExec'){if(!r.insp.diag){toast('اكتب تشخيص العطل قبل الاعتماد','error');return}set(3);r.exe=r.exe||{pct:0,state:'جاري الصيانة والتنفيذ',log:[]};msg(`اكتملت المعاينة: ${r.insp.diag}`);toast('اعتُمدت المعاينة وبدأ التنفيذ')}else toast('حُفظت المعاينة')}
  else if(a==='saveExec'){r.exe=r.exe||{pct:0,state:'جاري الصيانة والتنفيذ',log:[]};const b=bookOf(r);const n=v('exN');
    if(isContractor()&&b){if(!n){toast('اكتب ملخص التحديث','error');return}r.exe.log.push({t:n,pct:bookProgress(b),at:today()+' '+nowT(),by:me.name})}
    else{r.exe.pct=+($('#exP')?.value||0);r.exe.state=v('exS');if(!n){toast('اكتب ملاحظة التحديث','error');return}r.exe.log.push({t:n,pct:r.exe.pct,at:today()+' '+nowT(),by:me.name});if($('#exI')?.checked)threadFor(r,'req').msgs.push({me:1,t:`تحديث على طلبكم #${r.id}: ${n} (الإنجاز ${r.exe.pct}%)`,at:nowT()})}
    S.notifs.unshift({t:`${me.name} حدّث الطلب #${r.id}`,at:'الآن',go:'requests'});toast('حُفظ التحديث وأُرسل للإدارة')}
  else if(a==='toDoc'){const b=bookOf(r);const pc=isContractor()&&b?bookProgress(b):+($('#exP')?.value??r.exe?.pct??0);if(pc<100){toast(`نسبة الإنجاز ${pc}%، أكمل التنفيذ (100%) قبل الانتقال للتوثيق`,'error');return}if(r.exe&&!(isContractor()&&b))r.exe.pct=100;set(4);toast('انتقل الطلب لمرحلة التوثيق والتقييم')}
  else if(a==='saveDoc'){r.report=v('dcT');r.pieces=readPieces(document);toast('حُفظ التوثيق')}
  else if(a==='askRate'){r.report=v('dcT')||r.report;r.pieces=readPieces(document);if(!r.report){toast('اكتب تقرير الإنجاز أولاً','error');return}if(!stAtts(r,4).length){toast('أرفق صورة واحدة على الأقل لما بعد التنفيذ','error');return}askRating(r);toast('أُرسل طلب التقييم إلى '+r.by,'reviews')}
  else if(a==='simRate'){r.rating=5;r.ratingComment='جزاكم الله خيراً، عمل متقن وفي الموعد';threadFor(r,'req').msgs.push({me:0,t:`قيّمت الخدمة 5 من 5: ${r.ratingComment}`,at:nowT()});toast('وصل تقييم الإمام (محاكاة)','star')}
  else if(a==='toClose'){if(!r.ratingRequested){toast('أرسل طلب التقييم للإمام قبل الانتقال للإغلاق','error');return}set(5);toast('الطلب جاهز للإغلاق')}
  else if(a==='gotoClose'){UI.stg=5;toast(curStage(r)<5?'أكمل المراحل السابقة أولاً للوصول للإغلاق':'','info')}
  else if(a==='close'){r.closed=true;r.status='منتهي';r.doneAt=today();me.done++;me.status='متاح';msg(`أُغلق الطلب #${r.id} وسُلّم رسمياً.`);S.notifs.unshift({t:`${me.name} أغلق الطلب #${r.id}`,at:'الآن',go:'requests'});planHit(r);toast('أُغلق الطلب وسُلّم رسمياً','task_alt')}
  else if(a==='return'){const d=v('rtD');if(!d){toast('اكتب تفاصيل وبيان الأسباب','error');return}const u=$('[name=rtU]:checked')?.value;r.notes=r.notes||[];r.notes.push({t:`إرجاع للإدارة (${u}): ${v('rtR')} - ${d}`,by:me.name,at:today()});msg(`أرجعت الطلب #${r.id} للإدارة: ${v('rtR')} - ${d}`);S.notifs.unshift({t:`${me.name} أرجع الطلب #${r.id} (${u})`,at:'الآن',go:'requests'});r.rep='';r.status='جديدة';r.stage=1;r.ack=false;me.status='متاح';toast('أُرجع الطلب للإدارة وأُشعر المشرف','assignment_return');go('p_tasks');return}
  else if(a==='pdf'){taskPdf(r);return}
  else if(a==='bookPdf'){bookPdf(bookOf(r));return}
  else if(a==='execPrint'){execPrint(r);return}
  else if(a==='chat'){UI.chat=threadFor(r,'rep').id;go('chats');return}
  render();if(['toInsp','toExec','toDoc','toClose','gotoClose','close'].includes(a))$('#stgPanel')?.scrollIntoView({block:'start',behavior:'smooth'});
});

/* stage-tagged attachments */
const _attList=attList;
attList=function(key){if(!key.startsWith('rq:'))return _attList(key);const [,id,st]=key.split(':');const r=S.requests.find(x=>x.id===id);
  return{push:(...L)=>{L.forEach(a=>{a.stage=+st;a.kind=UI.attKind;a.by='rep'});r.atts.push(...L)},findIndex:f=>r.atts.findIndex(f),splice:(i,n)=>r.atts.splice(i,n)}};
go=function(k){if(SESSION.type!=='rep'){UI.view='login';render();return}if(!VIEWS[k]||(!allowed(k)&&k!=='p_task'))k='p_home';UI.view=k;try{history.replaceState(null,'','#'+k)}catch(e){}render();$('#rail').classList.remove('open');window.scrollTo(0,0)};

const myBooks=()=>S.booklets.filter(b=>b.by===SESSION.id);
const RB_EDIT=b=>['مسودة المندوب','معادة للمندوب'].includes(b.status);
const RB_STEPS=['التسجيل','الإرسال للإدارة','المراجعة والتسعير','اعتماد مجلس الإدارة','الطرح للمقاولين','الترسية والتنفيذ'];
function rbStep(b){const o=oppFor(b);if(o?.status==='مُرساة'||b.contractor)return 6;if(o)return 5;if(b.status==='معتمدة')return 4;if(['مسودة','بانتظار مجلس الإدارة'].includes(b.status))return 3;if(b.status==='واردة من المندوب')return 2;return 1}
const rbLabel=b=>{const s=rbStep(b);return b.status==='معادة للمندوب'?['معادة للتعديل','bad']:b.status==='مسودة المندوب'?['مسودة','']:s===2?['مرسلة - بانتظار المراجعة','gold']:s===3?['قيد التسعير والاعتماد','info']:s===4?['معتمدة من المجلس','ok']:s===5?['مطروحة للمقاولين','info']:['مُرساة على مقاول','ok']};
const rbTracker=b=>{const s=rbStep(b);return `<div class="timeline">${RB_STEPS.map((t,i)=>`<div class="step ${i+1<s||(s===6&&i===5)?'done':i+1===s?'cur':''}">${t}</div>`).join('')}</div>`};

  return `${a}<div class="stg-pc"><div class="bar"><i style="width:${p}%;${p>=100?'background:var(--ok)':''}"></i></div><b class="num">${p}%</b></div>${b}`})}

/* ---------- 2) photos before / during / after — shown AFTER the stages panel (i.e. after the closing stage) ---------- */
function afterBlock(h,marker,ins){const i=h.indexOf(marker);if(i<0)return h+ins;let d=0;const re=/<\/?div\b/g;re.lastIndex=i;let m;while((m=re.exec(h))){d+=m[0]==='<div'?1:-1;if(d===0){const j=h.indexOf('>',m.index)+1;return h.slice(0,j)+ins+h.slice(j)}}return h+ins}
function phaseOf(a){const k=a.kind||'';if(/قبل|فحص/.test(k))return 0;if(/أثناء/.test(k))return 1;if(/بعد|تسليم|استلام/.test(k))return 2;if(a.by==='requester'||a.stage===1||a.stage===2)return 0;if(a.stage===3)return 1;if(a.stage>=4)return 2;return null}
function phasePhotos(r){const L=(r.atts||[]).filter(a=>a.type==='image');if(!L.length)return '';const P=[[],[],[]];L.forEach(a=>{const p=phaseOf(a);if(p!=null)P[p].push(a)});

  const box=$('#gsearch').closest('.search');if(!box)return;const groups={};all.forEach(x=>(groups[x.g]=groups[x.g]||[]).push(x));G_RES=[];

/* ================= عقود المشاريع: إرفاق ملف العقد (PDF أو صورة) وعرضه وتحميله ================= */
const ctBlob=u=>{const [h,b]=u.split(',');const m=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})};
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' م.ب':Math.max(1,Math.round(n/1024))+' ك.ب';
function ctFileHTML(c,admin){const f=c.file;const can=admin&&typeof isSys==='function'&&isSys();
  return `<div class="ct-file">${ic(f?(f.type==='application/pdf'?'picture_as_pdf':'image'):'attach_file')}<span style="flex:1;min-width:0">${f?`<b class="small">${esc(f.name)}</b><span class="tiny muted" style="display:block">ملف العقد · ${fmtSize(f.size||0)} · أُرفق ${esc(f.at||'')}${f.by?' · '+esc(f.by):''}</span>`:`<b class="small">ملف العقد</b><span class="tiny muted" style="display:block">${admin?'لم يُرفق ملف العقد بعد (PDF أو صورة)':'لم تُرفق الجمعية ملف العقد بعد'}</span>`}</span>
    <div class="row">${f?`<button class="btn sm" data-act="ctView" data-id="${c.id}">${ic('visibility')}عرض</button><button class="btn sm" data-act="ctDl" data-id="${c.id}">${ic('download')}تحميل</button>`:''}${can?`<label class="btn sm ${f?'':'pri'}">${ic(f?'swap_horiz':'upload_file')}${f?'استبدال':'إرفاق العقد'}<input type="file" accept="application/pdf,image/*" data-ctup="${c.id}" hidden></label>${f?`<button class="btn sm danger" data-act="ctRm" data-id="${c.id}" aria-label="حذف ملف العقد">${ic('delete')}</button>`:''}`:''}</div></div>`}
const _ctcF=ctCard;ctCard=function(c,admin){const h=_ctcF(c,admin);const k='<div class="card-b" style="display:flex;flex-direction:column;gap:12px">';const i=h.indexOf(k);return i>-1?h.slice(0,i+k.length)+ctFileHTML(c,admin)+h.slice(i+k.length):h+ctFileHTML(c,admin)};
document.addEventListener('change',async e=>{const inp=e.target.closest('[data-ctup]');if(!inp)return;const f=inp.files[0];if(!f)return;const c=(S.contracts||[]).find(x=>x.id===inp.dataset.ctup);if(!c)return;
  if(!/pdf|image\//.test(f.type)){toast('ارفع ملف PDF أو صورة','error');return}if(f.size>4*1048576){toast('حجم ملف العقد أكبر من 4 م.ب، اضغطه ثم أعد المحاولة','error');return}
  const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});const old=c.file;c.file={name:f.name,type:f.type,size:f.size,data,at:today(),by:me()?.name||''};
  try{localStorage.setItem('zulfi-ct-test','1');localStorage.removeItem('zulfi-ct-test')}catch(err){}save();logIt(`إرفاق ملف العقد ${c.id}`);toast(old?'استُبدل ملف العقد':'أُرفق ملف العقد','attach_file');render()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act="ctView"],[data-act="ctDl"],[data-act="ctRm"]');if(!t)return;e.stopImmediatePropagation();const c=(S.contracts||[]).find(x=>x.id===t.dataset.id);if(!c||!c.file)return;const f=c.file,a=t.dataset.act;
  if(a==='ctDl'){saveFile(f.name,ctBlob(f.data));return}
  if(a==='ctRm'){modal({title:'حذف ملف العقد',icon:'delete',ok:'حذف',body:`<p class="small">سيُحذف الملف «${esc(f.name)}» من العقد ${c.id}. يمكنك إرفاق ملف آخر بعدها.</p>`,onOk:()=>{delete c.file;save();toast('حُذف ملف العقد','delete');render()}});return}
  const isPdf=f.type==='application/pdf';const w=modal({title:`عقد ${c.id}: ${f.name}`,icon:'description',wide:1,onOk:null,body:`<div class="ct-viewer" id="ctVw">${isPdf?'<div class="empty small">جاري عرض صفحات العقد…</div>':`<img src="${f.data}" alt="ملف العقد">`}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="ctDl" data-id="${c.id}">${ic('download')}تحميل</button></div>`});
  if(isPdf){(async()=>{try{const lib=window.pdfjsLib;if(!lib)throw 0;const doc=await lib.getDocument({data:ctBlob(f.data).arrayBuffer?new Uint8Array(await ctBlob(f.data).arrayBuffer()):null}).promise;const box=$('#ctVw',w);box.innerHTML='';

/* ================= حدود المرفقات (يحددها مدير النظام): طلبات التطبيق · لوحة التحكم · بوابة المناديب والمقاولين ================= */
const ATT_CTX={app:'طلبات التطبيق (مقدم الطلب)',panel:'لوحة التحكم',portal:'بوابة المناديب والمقاولين'};
const ATT_TYPES={img:'صور فقط',img_pdf:'صور وملفات PDF',all:'صور وPDF ومستندات'};
(function(){if(S.attLimits)return;S.attLimits={app:{max:5,mb:10,types:'img'},panel:{max:10,mb:20,types:'all'},portal:{max:8,mb:15,types:'img_pdf'}};save()})();
const attLim=k=>(S.attLimits||{})[k]||{max:10,mb:20,types:'all'};
const attCtx=key=>/^newreq/.test(key||'')?'app':SESSION.type==='rep'?'portal':'panel';
function attHint(key){try{if(/^(svcimg|opt:)/.test(key||''))return '';const L=attLim(attCtx(key));return `<div class="att-lim">${ic('rule')} الحد: <b class="num">${L.max}</b> ملفات · <b class="num">${L.mb}</b> م.ب للملف · ${ATT_TYPES[L.types]}</div>`}catch(e){return ''}}
const typeOk=(f,t)=>t==='all'||f.type.startsWith('image/')||(t==='img_pdf'&&f.type==='application/pdf');
function attCheck(files,key){const c=attCtx(key),L=attLim(c);let cur=0;try{const l=attList(key);cur=Array.isArray(l)?l.length:l&&l.length||0}catch(e){}
  if(/^(chat|upd)/.test(key)){/* pending lists: limit the batch */}
  if(key.startsWith('rq:')||key.startsWith('sa:')){const [,id,st]=key.split(':');const r=S.requests.find(x=>x.id===id);cur=r?(r.atts||[]).filter(a=>a.stage===+st).length:0}

  const w=el.offsetWidth,h=el.offsetHeight;let top=r.bottom+6;if(top+h>innerHeight-8&&r.top-h-6>8)top=r.top-h-6;top=Math.max(8,Math.min(top,innerHeight-h-8));let left=r.right-w;left=Math.max(8,Math.min(left,innerWidth-w-8));el.style.top=top+'px';el.style.left=left+'px'}

/* خانة الفترة النصية (مثل فترة المسابقة): اختيار «من» و«إلى» من التقويم فتُكتب الفترة بالهجري تلقائياً */
const dpHij=(v,y)=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',y?{day:'2-digit',month:'long',year:'numeric'}:{day:'2-digit',month:'long'}).format(new Date(v+'T12:00:00')).replace(' هـ','هـ')}catch(e){return v}};

  const box=t.parentElement,f=box.querySelector('[data-dpf]'),to=box.querySelector('[data-dpt]');
  const upd=()=>{if(f.value&&to.value&&to.value<f.value){to.value=f.value}if(f.value)to.min=f.value;if(f.value&&to.value)t.value=`${dpHij(f.value)} - ${dpHij(to.value,1)}`;else if(f.value)t.value=`من ${dpHij(f.value,1)}`};

const DK_BG={'#fff':'var(--surface)','#ffffff':'var(--surface)','white':'var(--surface)','#f5f7f9':'var(--surface-2)','#f2f4f6':'var(--surface-2)','#fbf8f1':'var(--gold-soft)','#f3ecdd':'var(--gold-soft)','#e3eef5':'var(--info-soft)','#e6f1f8':'var(--info-soft)','#eaf4ee':'var(--ok-soft)','#e7f3ec':'var(--ok-soft)','#e3f3ea':'var(--ok-soft)','#ffdad6':'var(--bad-soft)','#fbf0dc':'var(--warn-soft)','#e2e8f0':'var(--track)'};
const DK_FG={'#17384c':'var(--fg)','#143c54':'var(--fg)','#1d5271':'var(--teal)','#5b7383':'var(--muted)','#8a6f3d':'var(--gold-strong)','#ba1a1a':'var(--bad)','#2e7d5b':'var(--ok)','#316383':'var(--teal)'};

const DK_HEX=/#[0-9a-fA-F]{3,6}\b|\bwhite\b/g;
const isDk=()=>{const t=document.documentElement.dataset.theme;return t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)};
function dkFix(root){if(!isDk()||!root)return;const L=root.nodeType===1&&root.hasAttribute('style')?[root,...root.querySelectorAll('[style]')]:[...(root.querySelectorAll?root.querySelectorAll('[style]'):[])];
  L.forEach(el=>{const st=el.getAttribute('style');if(!st||!/#|white/i.test(st)||el.dataset.dk===st)return;
    const ns=st.split(';').map(dec=>{const i=dec.indexOf(':');if(i<0)return dec;const p=dec.slice(0,i).trim().toLowerCase(),v=dec.slice(i+1);const M=p==='background'||p==='background-color'?(/gradient|url\(/.test(v)?null:DK_BG):p==='color'?DK_FG:p.startsWith('border')?DK_BD:null;if(!M)return dec;return dec.slice(0,i+1)+v.replace(DK_HEX,h=>M[h.toLowerCase()]||h)}).join(';');
    if(ns!==st){el.setAttribute('style',ns)}el.dataset.dk=el.getAttribute('style')})}
