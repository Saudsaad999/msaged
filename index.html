<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جمعية المساجد بالزلفي · المنظومة الرقمية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Naskh+Arabic:wght@700&display=swap">
<style>
:root{--blue:#1D5271;--deep:#143C54;--gold:#C5A976;--dgold:#8A6F3D;--wash:#F3ECDD;--bg:#F5F7F9;--ink:#17384C;--muted:#5B7383;--line:#D6DFE5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
img{height:110px;max-width:80%}h1{font-family:"Noto Naskh Arabic",serif;color:var(--deep);font-size:30px;margin:0}p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%}
a.card{display:flex;flex-direction:column;gap:8px;padding:28px 22px;border-radius:12px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:0 2px 8px -2px rgba(23,56,76,.06);transition:.15s}
a.card:hover{box-shadow:0 8px 24px -4px rgba(23,56,76,.12);border-color:var(--gold)}a.card b{font-size:20px;color:var(--deep)}a.card span{color:var(--muted);font-size:14px}
a.card.pri{background:var(--blue);border-color:var(--blue)}a.card.pri b{color:#fff}a.card.pri span{color:#D6DFE5}
small{color:var(--dgold)}@media(max-width:560px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<img src="logo.png" alt="شعار جمعية المساجد بالزلفي">
<h1>المنظومة الرقمية</h1>
<p>اختر الواجهة التي تريد الدخول إليها</p>
<div class="cards">
<a class="card pri" href="admin.html"><b>لوحة التحكم</b><span>للموظفين وأعضاء مجلس الإدارة والجمعية العمومية والجهات المانحة</span></a>
<a class="card" href="portal.html"><b>بوابة المناديب والمقاولين</b><span>لاستقبال المهام وتنفيذها ومتابعتها من الجوال</span></a>
</div>
<small>خدمتكم هدفنا · نخدم بيوت الله بشرف وإتقان</small>
</main>
</body>
</html>
